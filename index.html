<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicodo - Font Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amatic SC', cursive;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Floating Doodle Art */
        .doodle-bg {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.2;
            user-select: none;
            pointer-events: none;
            animation: float 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(8deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .doodle-1 { top: 8%; left: 6%; animation-delay: 0s; }
        .doodle-2 { top: 15%; right: 8%; animation-delay: 1s; }
        .doodle-3 { bottom: 20%; left: 8%; animation-delay: 2s; }
        .doodle-4 { bottom: 15%; right: 6%; animation-delay: 1.5s; }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            line-height: 1;
            display: inline-block;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .logo:hover {
            animation: pulse 0.8s ease-in-out infinite;
        }

        .tagline {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .converter-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .converter-box {
                flex-direction: row;
                justify-content: space-between;
                align-items: stretch;
            }
        }

        .text-area-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            outline: none;
            box-shadow: inset 0 0 0 2px #000000;
            padding: 15px;
            font-size: 1.8rem;
            resize: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            box-shadow: inset 0 0 0 3.5px #000000;
            transform: scale(1.01);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .btn-group {
                width: auto;
                min-width: 180px;
            }
        }

        /* 3D Doodle Style Unique Buttons */
        button {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 12px 24px;
            font-size: 2.2rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.15s ease-in-out;
            border-radius: 4px;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
            background-color: #000000;
            color: #ffffff;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            z-index: 2;
        }

        .brand-text {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .social-icons {
            display: flex;
            gap: 22px;
        }

        .social-icons a {
            color: #000000;
            font-size: 2.2rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .social-icons a:hover {
            transform: scale(1.3) rotate(6deg);
        }
    </style>
</head>
<body>

    <div class="doodle-bg doodle-1">✦</div>
    <div class="doodle-bg doodle-2">✎</div>
    <div class="doodle-bg doodle-3">★</div>
    <div class="doodle-bg doodle-4">✿</div>

    <div class="container">
        <header>
            <div class="logo">UNICODO</div>
            <div class="tagline">AMS & KRUTIDEV TO UNICODE CONVERTER</div>
        </header>

        <div class="converter-box">
            <div class="text-area-container">
                <label for="input-text">INPUT TEXT</label>
                <textarea id="input-text" placeholder="Type or paste text here..."></textarea>
            </div>

            <div class="btn-group">
                <button id="ams-btn">CONVERT AMS</button>
                <button id="kruti-btn">CONVERT KRUTIDEV</button>
            </div>

            <div class="text-area-container">
                <label for="output-text">UNICODE OUTPUT</label>
                <textarea id="output-text" readonly placeholder="Unicode output will appear here..."></textarea>
            </div>
        </div>
    </div>

    <footer>
        <div class="brand-text">PushpamGFX</div>
        <div class="social-icons">
            <a href="https://instagram.com/pushpamgfx" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://Youtube.com/@PushpamGFX" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://X.com/@pushpamGFX" target="_blank" aria-label="Twitter/X"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </footer>

    <script>
        /* ===================================================================
           KRUTI DEV 010  ->  UNICODE (Devanagari) ENGINE
           This is a faithful JS port of the widely used / field-tested
           "KrutiDev_to_Unicode" character-repositioning algorithm
           (the same logic that powers most working KrutiDev converters).
           It fixes 3 things the old single-pass map could never do:
             1. Moves the "f" key (ि matra) to BEFORE the consonant it
                visually appears before in KrutiDev (matra reordering).
             2. Moves the "Z" key (repha / half-र, e.g. "करदZuk") to the
                correct position and turns it into "र्".
             3. Replaces multi-character KrutiDev sequences (conjuncts,
                aspirated letters, poorna virama, digits, punctuation)
                using the FULL official glyph table instead of a partial
                one, in the correct priority order (longer/complex
                sequences first).
        =================================================================== */
        function convertKrutidevToUnicode(text) {
            if (!text) return "";

            const array_one = [
                "ñ","Q+Z","sas","aa",")Z","ZZ","‘","’","“","”",
                "å","ƒ","„","…","†","‡","ˆ","‰","Š","‹",
                "¶+","d+","[+k","[+","x+","T+","t+","M+","<+","Q+",";+","j+","u+",
                "Ùk","Ù","Dr","–","—","é","™","=kk","f=k",
                "à","á","â","ã","ºz","º","í","{k","{","=","«",
                "Nî","Vî","Bî","Mî","<î","|","K","}",
                "J","Vª","Mª","<ªª","Nª","Ø","Ý","nzZ","æ","ç","Á","xz","#",":",
                "v‚","vks","vkS","vk","v","b±","Ã","bZ","b","m","Å",",s",",","_",
                "ô","d","Dk","D","[k","[","x","Xk","X","Ä","?k","?","³",
                "pkS","p","Pk","P","N","t","Tk","T",">","÷","¥",
                "ê","ë","V","B","ì","ï","M+","<+","M","<",".k",".",
                "r","Rk","R","Fk","F",")","n","/k","èk","/","Ë","è","u","Uk","U",
                "i","Ik","I","Q","¶","c","Ck","C","Hk","H","e","Ek","E",
                ";","¸","j","y","Yk","Y","G","o","Ok","O",
                "'k","'","\"k","\"","l","Lk","L","g",
                "È","z",
                "Ì","Í","Î","Ï","Ñ","Ò","Ó","Ô","Ö","Ø","Ù","Ük","Ü",
                "‚","ks","kS","k","h","q","w","`","s","S",
                "a","¡","%","W","•","·","∙","·","~j","~","\\","+"," ः",
                "^","*","Þ","ß","(","¼","½","¿","À","¾","A","-","&","&","Œ","]","~ ","@"
            ];

            const array_two = [
                "॰","QZ+","sa","a","र्द्ध","Z","\"","\"","'","'",
                "०","१","२","३","४","५","६","७","८","९",
                "फ़्","क़","ख़","ख़्","ग़","ज़्","ज़","ड़","ढ़","फ़","य़","ऱ","ऩ",
                "त्त","त्त्","क्त","दृ","कृ","न्न","न्न्","=k","f=",
                "ह्न","ह्य","हृ","ह्म","ह्र","ह्","द्द","क्ष","क्ष्","त्र","त्र्",
                "छ्य","ट्य","ठ्य","ड्य","ढ्य","द्य","ज्ञ","द्व",
                "श्र","ट्र","ड्र","ढ्र","छ्र","क्र","फ्र","र्द्र","द्र","प्र","प्र","ग्र","रु","रू",
                "ऑ","ओ","औ","आ","अ","ईं","ई","ई","इ","उ","ऊ","ऐ","ए","ऋ",
                "क्क","क","क","क्","ख","ख्","ग","ग","ग्","घ","घ","घ्","ङ",
                "चै","च","च","च्","छ","ज","ज","ज्","झ","झ्","ञ",
                "ट्ट","ट्ठ","ट","ठ","ड्ड","ड्ढ","ड़","ढ़","ड","ढ","ण","ण्",
                "त","त","त्","थ","थ्","द्ध","द","ध","ध","ध्","ध्","ध्","न","न","न्",
                "प","प","प्","फ","फ्","ब","ब","ब्","भ","भ्","म","म","म्",
                "य","य्","र","ल","ल","ल्","ळ","व","व","व्",
                "श","श्","ष","ष्","स","स","स्","ह",
                "ीं","्र",
                "द्द","ट्ट","ट्ठ","ड्ड","कृ","भ","्य","ड्ढ","झ्","क्र","त्त्","श","श्",
                "ॉ","ो","ौ","ा","ी","ु","ू","ृ","े","ै",
                "ं","ँ","ः","ॅ","ऽ","ऽ","ऽ","ऽ","्र","्","?","़",":",
                "‘","’","“","”",";","(",")","{","}","=","।",".","-","µ","॰",",","् ","/"
            ];

            // Helper that mirrors Python's str.rfind(sub, start, end)
            function pyRfind(s, sub, start, end) {
                if (end === undefined) end = s.length;
                if (end <= start) return -1;
                const idx = s.slice(start, end).lastIndexOf(sub);
                return idx === -1 ? -1 : idx + start;
            }

            let str = " " + text + " ";

            // --- Step 1: reposition "f" (ि matra) before the consonant it belongs to ---
            let position_of_f = pyRfind(str, "f", 0, str.length);
            while (position_of_f !== -1) {
                str = str.slice(0, position_of_f) + str[position_of_f + 1] + str[position_of_f] + str.slice(position_of_f + 2);
                position_of_f = pyRfind(str, "f", 0, position_of_f - 1);
            }
            str = str.split("f").join("ि");
            str = str.trim();

            // --- Step 2: reposition "Z" (repha / half-र) before the correct consonant ---
            str = " " + str + " ";
            let position_of_r = str.indexOf("Z");
            const set_of_matras = ["‚","ks","kS","k","h","q","w","`","s","S","a","¡","%","W","·","~ ","~"];
            while (position_of_r !== -1) {
                str = str.replace("Z", "");
                if (set_of_matras.includes(str[position_of_r - 1])) {
                    str = str.slice(0, position_of_r - 2) + "j~" + str.slice(position_of_r - 2);
                } else {
                    str = str.slice(0, position_of_r - 1) + "j~" + str.slice(position_of_r - 1);
                }
                position_of_r = str.indexOf("Z");
            }
            str = str.trim();

            // --- Step 3: replace KrutiDev ASCII sequences with Unicode Devanagari ---
            for (let i = 0; i < array_one.length; i++) {
                str = str.split(array_one[i]).join(array_two[i]);
            }

            return str;
        }

        /* ===================================================================
           AMS  ->  UNICODE (Devanagari) ENGINE
           NOTE: "AMS" isn't one fixed standard like KrutiDev010 - IndiaFont
           alone ships 100+ AMS fonts and some use their own key layout.
           This engine treats AMS as a phonetic layout (each key = a
           consonant/vowel sound, matras attach automatically, virama is
           inserted automatically between consonant clusters) instead of
           the old dumb 1-to-1 character swap, which produced letters like
           "नअमअसकअर" instead of "नमस्कर". If your specific AMS font still
           doesn't match, tell me the exact key -> glyph pairs (or a sample
           input/output) and I'll tune the tables to match it exactly.
        =================================================================== */
        function convertAMSToUnicode(text) {
            if (!text) return "";

            const consonants = {
                'k':'क','K':'ख','g':'ग','G':'घ',
                'c':'च','C':'छ','j':'ज','J':'झ','Y':'ञ',
                't':'त','T':'ठ','d':'द','D':'ध','n':'न','N':'ण',
                'p':'प','P':'फ','b':'ब','B':'भ','m':'म',
                'y':'य','r':'र','l':'ल','L':'ळ','v':'व','w':'व',
                's':'स','S':'श','Z':'ष','h':'ह',
                'x':'क्ष','W':'ज्ञ'
            };

            const matras = { 'A':'ा','i':'ि','I':'ी','u':'ु','U':'ू','R':'ृ','e':'े','E':'ै','o':'ो','O':'ौ' };
            const independentVowels = { 'a':'अ','A':'आ','i':'इ','I':'ई','u':'उ','U':'ऊ','R':'ऋ','e':'ए','E':'ऐ','o':'ओ','O':'औ' };
            const digits = { '0':'०','1':'१','2':'२','3':'३','4':'४','5':'५','6':'६','7':'७','8':'८','9':'९' };

            let output = "";
            let pendingConsonant = false; // true right after a "bare" consonant awaiting a vowel/halant

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];

                if (consonants[ch]) {
                    if (pendingConsonant) output += "्"; // join as a conjunct
                    output += consonants[ch];
                    pendingConsonant = true;
                    continue;
                }

                if (ch === 'a') {
                    // inherent vowel: silent after a consonant, else a standalone अ
                    if (!pendingConsonant) output += independentVowels['a'];
                    pendingConsonant = false;
                    continue;
                }

                if (matras[ch] || independentVowels[ch]) {
                    output += pendingConsonant ? matras[ch] : independentVowels[ch];
                    pendingConsonant = false;
                    continue;
                }

                if (ch === 'M') { output += 'ं'; pendingConsonant = false; continue; }
                if (ch === 'H') { output += 'ः'; pendingConsonant = false; continue; }

                if (digits[ch]) {
                    if (pendingConsonant) { output += "्"; pendingConsonant = false; }
                    output += digits[ch];
                    continue;
                }

                // spaces, punctuation, or any unmapped character pass through unchanged
                pendingConsonant = false;
                output += ch;
            }

            return output;
        }

        document.getElementById('kruti-btn').addEventListener('click', function() {
            let input = document.getElementById("input-text").value;
            document.getElementById("output-text").value = convertKrutidevToUnicode(input);
        });

        document.getElementById('ams-btn').addEventListener('click', function() {
            let input = document.getElementById("input-text").value;
            document.getElementById("output-text").value = convertAMSToUnicode(input);
        });
    </script>
</body>
</html>
