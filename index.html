<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicodo - Font Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amatic SC', cursive;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Floating Doodle Art */
        .doodle-bg {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.2;
            user-select: none;
            pointer-events: none;
            animation: float 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(8deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .doodle-1 { top: 8%; left: 6%; animation-delay: 0s; }
        .doodle-2 { top: 15%; right: 8%; animation-delay: 1s; }
        .doodle-3 { bottom: 20%; left: 8%; animation-delay: 2s; }
        .doodle-4 { bottom: 15%; right: 6%; animation-delay: 1.5s; }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            line-height: 1;
            display: inline-block;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .logo:hover {
            animation: pulse 0.8s ease-in-out infinite;
        }

        .tagline {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .converter-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .converter-box {
                flex-direction: row;
                justify-content: space-between;
                align-items: stretch;
            }
        }

        .text-area-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            outline: none;
            box-shadow: inset 0 0 0 2px #000000;
            padding: 15px;
            font-size: 1.8rem;
            resize: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            box-shadow: inset 0 0 0 3.5px #000000;
            transform: scale(1.01);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .btn-group {
                width: auto;
                min-width: 180px;
            }
        }

        /* 3D Doodle Style Unique Buttons */
        button {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 12px 24px;
            font-size: 2.2rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            position: relative;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.15s ease-in-out;
            border-radius: 4px;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
            background-color: #000000;
            color: #ffffff;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            z-index: 2;
        }

        .brand-text {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .social-icons {
            display: flex;
            gap: 22px;
        }

        .social-icons a {
            color: #000000;
            font-size: 2.2rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .social-icons a:hover {
            transform: scale(1.3) rotate(6deg);
        }
    </style>
</head>
<body>

    <div class="doodle-bg doodle-1">✦</div>
    <div class="doodle-bg doodle-2">✎</div>
    <div class="doodle-bg doodle-3">★</div>
    <div class="doodle-bg doodle-4">✿</div>

    <div class="container">
        <header>
            <div class="logo">UNICODO</div>
            <div class="tagline">AMS & KRUTIDEV TO UNICODE CONVERTER</div>
        </header>

        <div class="converter-box">
            <div class="text-area-container">
                <label for="input-text">INPUT TEXT</label>
                <textarea id="input-text" placeholder="Type or paste text here..."></textarea>
            </div>

            <div class="btn-group">
                <button id="ams-btn">CONVERT AMS</button>
                <button id="kruti-btn">CONVERT KRUTIDEV</button>
            </div>

            <div class="text-area-container">
                <label for="output-text">UNICODE OUTPUT</label>
                <textarea id="output-text" readonly placeholder="Unicode output will appear here..."></textarea>
            </div>
        </div>
    </div>

    <footer>
        <div class="brand-text">PushpamGFX</div>
        <div class="social-icons">
            <a href="https://instagram.com/pushpamgfx" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://Youtube.com/@PushpamGFX" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://X.com/@pushpamGFX" target="_blank" aria-label="Twitter/X"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </footer>

    <script>
        // Advanced Krutidev Engine
        function convertKrutidevToUnicode(text) {
            if(!text) return "";

            let array_one = ["ñ", "Q+", "w", "s", "m", "n", "z", "S", "d", "a", "r", "g", "i", "k", "f", "l", "b", "h", "j", "d;", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "P", "Q", "R", "T", "U", "V", "W", "X", "Y", "Z", "v", "y", "c", "e", "x", "p", "o", "v+", "y+", "c+", "e+", "x+", "o+"];
            let array_two = ["ह्र", "कृ", "्", "ं", "ा", "ु", "ू", "ृ", "े", "ै", "ो", "ौ", "ि", "ी", "ँ", "ः", "्", "्", "्", "द्ग", "अ", "इ", "उ", "ऋ", "ए", "ऐ", "ओ", "औ", "क", "ख", "ग", "घ", "ङ", "च", "छ", "ज", "झ", "ञ", "ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न", "प", "फ", "ब", "भ", "म", "य", "र", "ल", "व", "श", "०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

            let str = text;
            for (let i = 0; i < array_one.length; i++) {
                let reg = new RegExp(array_one[i].replace(/([.*+?^=!:${}()|\[\]\/\\])/g, "\\$1"), 'g');
                str = str.replace(reg, array_two[i]);
            }

            // Fix Matra Position Rules
            let position_of_i = str.indexOf("ि");
            while (position_of_i !== -1) {
                let character_to_be_replaced = str.charAt(position_of_i + 1);
                str = str.replace("ि" + character_to_be_replaced, character_to_be_replaced + "ि");
                position_of_i = str.indexOf("ि", position_of_i + 2);
            }

            return str;
        }

        // Advanced AMS Engine
        function convertAMSToUnicode(text) {
            if(!text) return "";

            let ams_map = {
                'a': 'अ', 'A': 'आ', 'i': 'इ', 'I': 'ई', 'u': 'ु', 'U': 'ू', 'e': 'ए', 'E': 'ऐ', 'o': 'ओ', 'O': 'औ',
                'k': 'क', 'K': 'ख', 'g': 'ग', 'G': 'घ', 'c': 'च', 'C': 'छ', 'j': 'ज', 'J': 'झ', 'Y': 'ञ',
                't': 'त', 'T': 'ठ', 'd': 'द', 'D': 'ध', 'n': 'न', 'N': 'ण', 'p': 'प', 'P': 'फ', 'b': 'ब', 'B': 'भ', 'm': 'म',
                'y': 'य', 'r': 'र', 'l': 'ल', 'L': 'ळ', 'v': 'व', 'w': 'व', 's': 'स', 'S': 'श', 'Z': 'ष', 'h': 'ह',
                'x': 'क्ष', 'W': 'ज्ञ', 'R': 'ऋ', 'H': 'ः', 'M': 'ं', '1': '१', '2': '२', '3': '३', '4': '४', '5': '५', '6': '६', '7': '७', '8': '८', '9': '९', '0': '०'
            };

            let str = text;
            let output = "";
            for (let i = 0; i < str.length; i++) {
                let ch = str[i];
                output += ams_map[ch] ? ams_map[ch] : ch;
            }
            return output;
        }

        document.getElementById('kruti-btn').addEventListener('click', function() {
            let input = document.getElementById("input-text").value;
            document.getElementById("output-text").value = convertKrutidevToUnicode(input);
        });

        document.getElementById('ams-btn').addEventListener('click', function() {
            let input = document.getElementById("input-text").value;
            document.getElementById("output-text").value = convertAMSToUnicode(input);
        });
    </script>
</body>
</html>
